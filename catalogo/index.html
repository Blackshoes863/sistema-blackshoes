<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catalogo BlackShoes</title>
    <meta name="description" content="Catalogo publico de BlackShoes conectado a los productos reales del sistema.">
    <meta name="theme-color" content="#111111">
    <meta property="og:title" content="Catalogo BlackShoes">
    <meta property="og:description" content="Catalogo publico de BlackShoes.">
    <meta property="og:image" content="https://sistema-blackshoes.vercel.app/assets/blackshoes-social.png?v=2">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sistema-blackshoes.vercel.app/catalogo">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://sistema-blackshoes.vercel.app/assets/blackshoes-social.png?v=2">
    <link rel="manifest" href="/manifest.json?v=6">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/blackshoes-favicon-32.png?v=2">
    <link rel="apple-touch-icon" href="/assets/blackshoes-apple-touch.png?v=2">
    <link rel="stylesheet" href="/catalogo/catalogo.css?v=9">
  </head>
  <body>
    <header class="catalog-header">
      <a class="brand" href="/catalogo">
        <span class="brand-mark" aria-hidden="true"><img src="/assets/blackshoes-header-logo.png" alt=""></span>
        <strong>BlackShoes</strong>
      </a>
      <span class="status-pill" id="catalogStatus">Catalogo en preparacion</span>
    </header>

    <main class="catalog-shell">
      <section class="catalog-intro">
        <p>Catalogo publico</p>
        <h1>Conoce nuestros productos</h1>
      </section>

      <section class="catalog-toolbar" aria-label="Filtros del catalogo">
        <input id="catalogSearch" type="search" placeholder="Buscar producto">
        <select id="catalogCategory" aria-label="Categoria">
          <option value="all">Categorias</option>
        </select>
        <select id="catalogSubcategory" aria-label="Subcategoria">
          <option value="all">Subcategorias</option>
        </select>
        <select id="catalogColor" aria-label="Color">
          <option value="all">Colores</option>
        </select>
        <select id="catalogSize" aria-label="Talle">
          <option value="all">Talles</option>
        </select>
        <div class="price-filter">
          <input id="catalogMinPrice" type="number" min="0" step="1" placeholder="Precio min.">
          <input id="catalogMaxPrice" type="number" min="0" step="1" placeholder="Precio max.">
        </div>
        <select id="catalogSort" aria-label="Ordenar productos">
          <option value="new">Mas nuevos</option>
          <option value="priceAsc">Menor precio</option>
          <option value="priceDesc">Mayor precio</option>
        </select>
      </section>

      <section class="catalog-grid" id="catalogGrid"></section>
      <nav class="catalog-pagination" id="catalogPagination" aria-label="Paginacion del catalogo" hidden></nav>
      <section class="catalog-empty" id="catalogEmpty" hidden>
        <h2>Catalogo todavia no disponible</h2>
        <p>Cuando creemos Supabase nuevo para BlackShoes, esta pagina va a mostrar los mismos productos, precios, stock y variantes que cargues en el sistema interno.</p>
      </section>
    </main>

    <script src="/catalogo/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/catalogo/catalogo.js?v=13"></script>
  </body>
</html>
